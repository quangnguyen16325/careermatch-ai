[project]
name = "careermatch-ai-service"
version = "0.1.0"
description = "Structured AI analysis and matching boundary for CareerMatch AI"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
